# Triggered manually with a version input. Bumps version.txt + package.json
# files via `nacho-build version --apply`, commits "Release X.Y.Z" to main,
# tags vX.Y.Z, and pushes both. The existing publish job in ci.yml fires on
# the tag push and publishes to npm.
#
# Authenticates as a GitHub App whose identity is in the main branch ruleset's
# bypass_actors, so it can push directly to main without going through a PR.
#
# Setup required (one-time):
#   - GitHub App with contents:write installed on this repo
#   - Org (or repo) secret BOT_APP_PRIVATE_KEY: the App's .pem private key
#   - Org (or repo) variable BOT_APP_ID: the App's numeric ID
#   - The App listed in the "protect main" ruleset's bypass_actors

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit release version (leave empty to bump current)'
        required: false
        type: string
      bump:
        description: 'Bump kind (used only if version is empty)'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NAME="${{ steps.app-token.outputs.app-slug }}[bot]"
          ID=$(gh api "/users/$NAME" --jq .id)
          git config user.name "$NAME"
          git config user.email "${ID}+${NAME}@users.noreply.github.com"

      - name: Apply version
        id: apply
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            node bin/build.js version "${{ inputs.version }}" --set --apply
          else
            node bin/build.js version --bump "${{ inputs.bump }}" --set --apply
          fi
          echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit
        run: |
          git add -A
          git commit -m "Release ${{ steps.apply.outputs.version }}"

      - name: Tag
        run: node bin/build.js version --tag

      - name: Push
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.apply.outputs.version }}"
